name: secret-scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop
      # NOTE: Existing lint.yaml / test.yaml only target main, but secret-scan
      # also targets develop due to its security importance.
      # Adjust per your project's branching strategy.

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.0"

jobs:
  gitleaks:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout (pull_request)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout (push)
        if: github.event_name == 'push'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          install_dir="${HOME}/.local/bin"
          mkdir -p "${install_dir}"
          case "$(uname -m)" in
            x86_64|amd64)
              gitleaks_arch="x64"
              ;;
            aarch64|arm64)
              gitleaks_arch="arm64"
              ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          archive_name="gitleaks_${GITLEAKS_VERSION}_linux_${gitleaks_arch}.tar.gz"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive_name}" \
            -o "${archive_name}"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            -o checksums.txt
          awk -v target="${archive_name}" \
            '$2 == target { print; found=1 } END { exit(found ? 0 : 1) }' \
            checksums.txt > gitleaks_checksums.txt
          sha256sum --check gitleaks_checksums.txt
          tar -xzf "${archive_name}" -C "${install_dir}" gitleaks
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/gitleaks" version

      - name: Scan PR diff
        if: github.event_name == 'pull_request'
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          if ! git fetch --no-tags origin "${BASE_REF}"; then
            echo "::warning::Failed to fetch base ref '${BASE_REF}'. Falling back to full history scan."
            gitleaks git --config .gitleaks.toml --redact
          elif ! BASE_SHA="$(git merge-base HEAD FETCH_HEAD)"; then
            echo "::warning::Could not determine merge-base against '${BASE_REF}'. Falling back to full history scan."
            gitleaks git --config .gitleaks.toml --redact
          else
            gitleaks git \
              --config .gitleaks.toml \
              --redact \
              --log-opts="${BASE_SHA}..HEAD"
          fi

      - name: Scan pushed commits
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"

          # New branch (all-zero before) or force-push (before commit no longer exists)
          if [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] || \
             ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "::warning::Cannot determine safe diff range (new branch or force-push). Running full history scan."
            gitleaks git --config .gitleaks.toml --redact
          else
            gitleaks git \
              --config .gitleaks.toml \
              --redact \
              --log-opts="${BEFORE}..${{ github.sha }}"
          fi

name: PR Auto Labeler

# Labels pull requests based on the `autolabeler` rules in
# .github/release-drafter.yml. Release drafting runs in a separate workflow
# (release-drafter.yml) so that this pull_request workflow only needs write
# permission on pull requests.

on:
  pull_request:
    # Only following types are handled by the action, but one can default to all as well
    types: [opened, reopened]
  # pull_request_target event is required for autolabeler to support PRs from forks.
  # Evaluate its risk separately before enabling it.
  # pull_request_target:
  #   types: [opened, reopened]

permissions:
  contents: read

jobs:
  auto_label:
    permissions:
      # read permission is required to read .github/release-drafter.yml
      contents: read
      # write permission is required to add labels to pull requests
      pull-requests: write
    runs-on: ubuntu-slim
    steps:
      - uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6.4.0
        with:
          disable-releaser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

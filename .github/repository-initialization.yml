# Tracks whether GitHub repository settings have been audited after
# creating a repository from this template.
#
# Agents use this file for the initial local status check without reading
# the referenced audit guide:
# - status: completed with a matching repository and equal, non-empty
#   required_audit_revision and completed_audit_revision values means
#   ordinary tasks may proceed.
# - status: pending or inconsistent metadata means initialization is
#   incomplete. Outside the template repository exception below, agents
#   must stop ordinary task work and wait for explicit approval.
# - allowed status values are: pending, completed.
# - In abeja-inc/dsg-project-template, the schema-v2 marker with a non-empty
#   required revision, status: pending, and empty repository and completed
#   revision is intentional because this file is copied to new repositories.
#   Do not treat that exact template marker as needing initialization.
#
# Read the referenced guide only after initialization is approved or when
# the user explicitly requests a fresh audit. Do not store secrets here.
schema_version: 2
required_audit_revision: recommended-repository-settings-v1
completed_audit_revision:
status: pending
repository:
completed_at:
completed_by:
reference: docs/agents/recommended-repository-settings.md
notes: "Template default. Repositories created from this template must audit settings before setting status to completed."

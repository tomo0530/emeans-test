[project]
name = "lastpass-secret-provider"
version = "0.1.0"
description = "Safe LastPass CLI wrapper for retrieving secrets in Python."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.4.2",
    "pytest-cov>=6.2.1",
    "ruff>=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lastpass_secret_provider"]

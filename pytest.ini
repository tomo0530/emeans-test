[pytest]
testpaths =
    project_module/tests
    libs/abeja-toolkit
python_files = test_*.py
addopts =
    -v
    --strict-markers
    # importlib mode avoids the package-name collision between
    # project_module/tests and libs/**/tests (both named "tests")
    --import-mode=importlib
    --ff
    -m "not integrate and not slow"
    --cov=project_module/src/project_module
    --cov-branch
    --cov-report=term-missing
markers =
    integrate: Tests that require external services (DB, API, etc.)
    slow:      Long-running tests
